<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briefing de Site — Levantamento com Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12;
  --bg-grad: radial-gradient(1100px 520px at 12% -8%, #10241F 0%, rgba(16,36,31,0) 60%),
             radial-gradient(900px 480px at 100% 0%, #131B2E 0%, rgba(19,27,46,0) 55%);
  --panel:#121620;
  --ink:#EDF0F4;
  --ink-soft:#8C95A6;
  --line:#232938;
  --navy:#F2F4F7;
  --navy-soft:#5FA8FF;
  --amber:#19E3A6;
  --amber-soft:#0E2A24;
  --ok:#19E3A6;
  --radius:6px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0; background:var(--bg-grad), var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  min-height:100%;
}
.mono{font-family:'IBM Plex Mono', monospace;}

.wrap{
  display:grid;
  grid-template-columns: 260px 1fr;
  max-width:1180px;
  margin:0 auto;
}
@media (max-width: 860px){ .wrap{ grid-template-columns: 1fr; } }

/* Sidebar */
nav.rail{
  border-right:1px solid var(--line);
  padding:32px 20px;
  position:sticky; top:0; align-self:start;
  height:100vh;
  overflow-y:auto;
}
@media (max-width: 860px){
  nav.rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); padding:24px 20px; }
}
.rail-title{
  font-size:13px; letter-spacing:.02em; color:var(--ink-soft);
  margin:0 0 4px 0;
}
.rail-h1{
  font-size:20px; font-weight:700; margin:0 0 24px 0; line-height:1.25;
  color:var(--navy);
}
.rail-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.rail-list a{
  display:flex; gap:10px; align-items:baseline;
  text-decoration:none; color:var(--ink-soft);
  padding:7px 8px; border-radius:var(--radius);
  font-size:14px;
}
.rail-list a:hover{ background:var(--amber-soft); color:var(--ink); }
.rail-list a .n{ font-size:12px; color:var(--amber); min-width:16px; }
.rail-list a.done{ color:var(--ok); }
.rail-list a.done .n::after{ content:"✓"; }
.rail-list a.done .n{ color:var(--ok); font-size:0; }
.rail-list a.done .n::after{ font-size:12px; }

.progress-wrap{margin-top:24px;}
.progress-bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
.progress-fill{height:100%; background:var(--amber); width:0%; transition:width .25s ease;}
.progress-label{font-size:12px; color:var(--ink-soft); margin-top:6px;}

/* Main */
main{ padding:40px 32px 120px; }
@media (max-width:860px){ main{padding:28px 18px 120px;} }

header.top{ margin-bottom:36px; max-width:640px; }
header.top p{ color:var(--ink-soft); font-size:15px; line-height:1.6; }

section.block{
  margin-bottom:40px; scroll-margin-top:20px;
}
.block-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
}
.block-num{ color:var(--amber); font-size:13px; }
.block-title{ font-size:19px; font-weight:700; color:var(--navy); margin:0; }
.block-sub{ color:var(--ink-soft); font-size:14px; margin:2px 0 18px 0; }

.q{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:10px;
}
.q label{
  display:block; font-size:14.5px; font-weight:500; margin-bottom:8px; line-height:1.4;
}
.q textarea, .q input[type=text]{
  width:100%; border:1px solid var(--line); border-radius:var(--radius);
  background:transparent; color:var(--ink);
  padding:9px 10px; font-family:inherit; font-size:14px; resize:vertical;
}
.q textarea{ min-height:44px; }
.q textarea:focus, .q input:focus{ outline:2px solid var(--navy-soft); outline-offset:1px; }
.q .optional-tag{ font-size:11px; color:var(--ink-soft); margin-left:6px; font-weight:400; }

.footer-actions{
  position:sticky; bottom:0; background:var(--bg);
  border-top:1px solid var(--line);
  padding:14px 32px calc(14px + env(safe-area-inset-bottom, 0px));
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  margin-left:-32px; margin-right:-32px;
}
@media (max-width:860px){ .footer-actions{ margin-left:-18px; margin-right:-18px; padding-left:18px; padding-right:18px; } }
button{
  font-family:inherit; font-size:14px; font-weight:600;
  border-radius:var(--radius); border:1px solid var(--amber);
  padding:10px 16px; cursor:pointer; background:var(--amber); color:#08130F;
}
button.secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
button:active{ transform:translateY(1px); }
button:hover{ filter:brightness(1.08); }
button.secondary:hover{ border-color:var(--amber); color:var(--amber); filter:none; }
.hint{ font-size:12.5px; color:var(--ink-soft); margin-left:auto; }
@media (max-width:860px){ .hint{ margin-left:0; width:100%; } }

.credit{
  text-align:center; font-size:11.5px; color:var(--ink-soft);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
  letter-spacing:.02em;
}

@media print{
  nav.rail, .footer-actions, .credit{ display:none; }
  .wrap{ grid-template-columns: 1fr; }
  .q{ break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail">
    <p class="rail-title mono">LEVANTAMENTO</p>
    <h1 class="rail-h1">Briefing de Site</h1>
    <ul class="rail-list" id="railList"></ul>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label mono" id="progressLabel">0 / 0 respondidas</div>
    </div>
  </nav>

  <main>
    <header class="top">
      <p>Vamos montar juntos a sua marca? Me conta um pouco mais sobre suas expectativas — o que você precisa para construirmos um site completo pra sua empresa, do jeito certo.</p>
    </header>
    <div id="sections"></div>
  </main>
</div>

<div class="footer-actions">
  <button id="sendBtn">Enviar respostas por e-mail</button>
  <button class="secondary" id="copyBtn">Copiar resumo</button>
  <button class="secondary" id="printBtn">Salvar como PDF</button>
  <button class="secondary" id="clearBtn">Limpar tudo</button>
  <span class="hint mono" id="copyHint"></span>
</div>
<div class="credit mono">Desenvolvido por Kally.MG — TI.kally@outlook.com</div>

<script>
const DATA = [
  {title:"O negócio", sub:"Contexto da empresa e do mercado", qs:[
    "Qual é o nome da empresa/marca e o que ela faz?",
    "Há quanto tempo o negócio existe?",
    "Quem são os concorrentes diretos? Tem sites (concorrentes ou não) que admira?",
    "Qual é o diferencial competitivo do negócio?",
    "Já existe manual de marca (logo, cores, fontes) definido?",
  ]},
  {title:"Objetivo do site", sub:"Para que o site existe", qs:[
    "Qual é o objetivo principal do site? (vender, gerar leads, institucional, portfólio, agendamentos...)",
    "Qual ação você quer que o visitante tome ao entrar no site?",
    "O site vai substituir ou complementar redes sociais / loja física?",
  ]},
  {title:"Público-alvo", sub:"Quem vai visitar o site", qs:[
    "Quem é o cliente ideal (idade, região, comportamento)?",
    "Como esse público costuma pesquisar ou comprar hoje?",
  ]},
  {title:"Estrutura e conteúdo", sub:"Páginas e materiais", qs:[
    "Quais páginas são necessárias? (Home, Sobre, Serviços, Blog, Contato...)",
    "Os textos já estão prontos ou o cliente precisa de ajuda com redação?",
    "Existem fotos/vídeos próprios de qualidade, ou será necessário banco de imagens?",
    "Vai ter blog ou seção de notícias?",
  ]},
  {title:"Funcionalidades", sub:"O que o site precisa fazer", qs:[
    "Precisa de formulário de contato? Para onde os dados devem ir (e-mail, CRM, planilha)?",
    "Precisa de loja virtual? Quantos produtos e quais formas de pagamento?",
    "Precisa de área de login/cliente?",
    "Precisa de integração com WhatsApp, redes sociais ou newsletter?",
    "Precisa de agendamento online?",
    "O site precisa ser multilíngue?",
  ]},
  {title:"Identidade visual", sub:"Aparência e estilo", qs:[
    "Já existe identidade visual definida ou será criada agora?",
    "Cores, fontes e estilo preferido (minimalista, moderno, corporativo, divertido...)?",
    "Tem referências visuais de sites que gosta ou não gosta?",
  ]},
  {title:"Técnico", sub:"Infraestrutura e manutenção", qs:[
    "Você já tem domínio e hospedagem, ou deseja que a gente providencie? (sujeito a cobrança)",
    "Precisa de e-mail profissional (@empresa.com)?",
    "Precisa de CMS para o cliente editar sozinho, ou site estático que só você atualiza?",
    "Há necessidade de SEO específico (palavras-chave, concorrência local)?",
    "Precisa integrar com sistemas que o cliente já usa (ERP, planilhas, ferramentas de gestão)?",
  ]},
  {title:"Prazo e orçamento", sub:"Viabilidade do projeto", qs:[
    "Qual é o prazo desejado para lançamento? Existe data fixa (evento, campanha)?",
    "Qual é o orçamento disponível?",
    "Haverá manutenção contínua após a entrega? Quem vai cuidar disso?",
  ]},
  {title:"Aprovação e comunicação", sub:"Como o projeto vai rodar", qs:[
    "Quem é o responsável por aprovar cada etapa do projeto?",
    "Qual o canal de comunicação preferido (WhatsApp, e-mail, reunião semanal)?",
  ]},
];

const sectionsEl = document.getElementById('sections');
const railEl = document.getElementById('railList');
let totalQs = 0;

DATA.forEach((sec, si) => {
  const secId = `sec-${si}`;
  const block = document.createElement('section');
  block.className = 'block';
  block.id = secId;
  const numStr = String(si+1).padStart(2,'0');

  let qHtml = '';
  sec.qs.forEach((q, qi) => {
    const inputId = `q-${si}-${qi}`;
    totalQs++;
    qHtml += `
      <div class="q">
        <label for="${inputId}">${q}</label>
        <textarea id="${inputId}" data-section="${si}" placeholder="Resposta do cliente..."></textarea>
      </div>`;
  });

  block.innerHTML = `
    <div class="block-head">
      <span class="block-num mono">${numStr}</span>
      <h2 class="block-title">${sec.title}</h2>
    </div>
    <p class="block-sub">${sec.sub}</p>
    ${qHtml}
  `;
  sectionsEl.appendChild(block);

  const railA = document.createElement('a');
  railA.href = `#${secId}`;
  railA.id = `rail-${si}`;
  railA.innerHTML = `<span class="n mono">${numStr}</span><span>${sec.title}</span>`;
  const li = document.createElement('li');
  li.appendChild(railA);
  railEl.appendChild(li);
});

function updateProgress(){
  const areas = document.querySelectorAll('textarea');
  let filled = 0;
  const filledBySection = {};
  areas.forEach(t => {
    if(t.value.trim().length > 0){
      filled++;
      const s = t.dataset.section;
      filledBySection[s] = (filledBySection[s]||0) + 1;
    }
  });
  document.getElementById('progressLabel').textContent = `${filled} / ${totalQs} respondidas`;
  document.getElementById('progressFill').style.width = totalQs ? `${(filled/totalQs)*100}%` : '0%';

  DATA.forEach((sec, si) => {
    const rail = document.getElementById(`rail-${si}`);
    const count = filledBySection[si] || 0;
    rail.classList.toggle('done', count === sec.qs.length);
  });
}

sectionsEl.addEventListener('input', (e) => {
  if(e.target.tagName === 'TEXTAREA') updateProgress();
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('clearBtn').addEventListener('click', () => {
  if(!confirm('Limpar todas as respostas preenchidas?')) return;
  document.querySelectorAll('textarea').forEach(t => t.value = '');
  updateProgress();
});

function buildSummary(){
  let out = 'BRIEFING DE SITE — RESUMO\n\n';
  DATA.forEach((sec, si) => {
    out += `${String(si+1).padStart(2,'0')} — ${sec.title.toUpperCase()}\n`;
    sec.qs.forEach((q, qi) => {
      const val = document.getElementById(`q-${si}-${qi}`).value.trim();
      out += `• ${q}\n  ${val ? val : '(não respondido)'}\n`;
    });
    out += '\n';
  });
  return out;
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const hint = document.getElementById('copyHint');
  try{
    await navigator.clipboard.writeText(buildSummary());
    hint.textContent = 'Copiado ✓';
  }catch(err){
    hint.textContent = 'Não foi possível copiar automaticamente — selecione o texto manualmente.';
  }
  setTimeout(() => hint.textContent = '', 2500);
});

const DEST_EMAIL = 'TI.kally@outlook.com';

document.getElementById('sendBtn').addEventListener('click', () => {
  const hint = document.getElementById('copyHint');
  const summary = buildSummary();
  const subject = 'Briefing de site — respostas preenchidas';
  const mailto = `mailto:${DEST_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(summary)}`;

  // Mail clients cap URL/body length (Outlook desktop is the strictest, ~2000 chars).
  // If the answers are long, fall back to clipboard + instructions instead of a broken mailto link.
  if(mailto.length > 1800){
    navigator.clipboard.writeText(summary).catch(()=>{});
    hint.textContent = 'Respostas longas: copiadas para a área de transferência — cole no seu e-mail.';
    window.location.href = `mailto:${DEST_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent('Resumo copiado — cole aqui (Ctrl+V / Cmd+V).')}`;
  } else {
    window.location.href = mailto;
    hint.textContent = 'Abrindo seu app de e-mail...';
  }
  setTimeout(() => hint.textContent = '', 4000);
});

updateProgress();
</script>
</body>
</html>
